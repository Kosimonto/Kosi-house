<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap">
     <link rel="stylesheet" href="house.css">
     <title>Housing Agent - Find House For Owerri & Orlu </title>
</head>
<body>
     <nav class="navbar navbar-expand-lg navbar-darkbg-transparent position-absolute w-100" style="z-index:10">
          <div class="container">
               <a href="" class="navbar-brand fw-bold fs-4">
                    <i class="">Owerri Homes</i>
               </a>
               <div class="ms-auto d-flex gap-2">
                    <a href="" class="btn btn-light rounded-pill px-4">
                         <i>Houses</i>
                    </a>
                    <button class="btn btn-outline-light rounded-pill" id="favCountBtn">
                         <i class="bi bi-heart"></i><span id="favCount">0</span>Saved
                    </button>
               </div>
          </div>
     </nav>
<!-- Hero section -->
     <div class="hero text-center">
          <div class="container">
               <h1 class="display-5 fw-bold mt-5">
                    Find Verified House For <br>Owerri & Orlu
               </h1>
               <p class="opacity-75 mt-3">
                    No Agent Wahala. Chat Landlord Direct.
               </p>
                    <div class="mx-auto mt-4" style="max-width:600px">
                         <div class="input-group-lg bg-white rounded-pill p-3 shadow">
                              <span class="input-group-text bg-white border-0 ps-3"><i class="bi bi-search"></i></span>
                              <input type="text" class="form-control border-0" id="searchInput" placeholder="Search:Orlu, 2bedroom, Nekede...">
                         </div>
                    </div>
          </div>
     </div>

     <!-- Filter -->
     <div class="container">
          <div class="filter-bar">
               <div class="row g-2 align-items-center">
                    <div class="col-md-3">
                         <select id="locationFilter" class="form-select rounded-pill">
                              <option value="all">All Locations</option>
                              <option value="Owerri">Owerri Town</option>
                              <option value="Orlu">Orlu</option>
                              <option value="Nekede">Nekede</option>
                              <option value="Ihiagwa">Ihiagwa</option>
                         </select>
                    </div>
                    <div class="col-md-3">
                         <select id="bedroomFilter" class="form-select rounded-pill">
                              <option value="all">Any Bedrooms</option>
                              <option value="1 Bedroom">1 Bedroom</option>
                              <option value="2 Bedroom">2 Bedroom</option>
                              <option value="3 Bedroom">3 Bedroom</option>
                         </select>
                    </div>
                    <div class="col-md-3">
                         <select id="priceFilter" class="form-select rounded-pill">
                              <option value="all">Any Price</option>
                              <option value="400">Below 400k</option>
                              <option value="600k">$400k -$600k</option>
                              <option value="1000">Above $600k</option>
                         </select>
                    </div>
                    <div class="col-md-3 text-end">
                         <button class="btn btn-dark rounded-pill w-100" onclick="resetFilters()">Reset</button>
                    </div>
               </div>
          </div>
     </div>


     <!-- House's Card -->
     <div class="container py-5">
          <div class="row g-4" id="houseGrid">
               <!-- House will be loaded by Js -->
          </div>
     </div>

     <!-- Quick View Modal (The inside homepage effect) -->
     <div class="modal fade" id="houseModal" tabindex="1">
          <div class="modal-dialog modal-lg modal-dialog-centered">
               <div class="modal-content rounded-4 border-0">
                    <div class="modal-body p-0" id="modalBody"></div>
               </div>
          </div>
     </div>


     <!-- footer -->
     <footer class="p-4 bg-dark text-white text-center position-relative">
          <div class="container">
               <p class="lead">Copyright &copy; Kosimonto_Tech 2026, All Rights Reserved</p>
               <a href="#" class="position-absolute bottom-0 end-0 p-4">
                    <i class="bi bi-arrow-up-circle h1"></i>
               </a>
          </div>
     </footer>

     <!-- Js Functionality -->
     <script src="house.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
